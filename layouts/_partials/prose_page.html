{{/* Generic prose page shell used by bio, teaching, resources, contact. */}}
<div class="gm-container gm-narrow">
  <nav class="gm-breadcrumb" data-pagefind-ignore aria-label="Breadcrumb"><a href="{{ site.Home.RelPermalink }}">{{ i18n "nav_home" }}</a> <span aria-hidden="true">/</span> <span aria-current="page">{{ .Title }}</span></nav>
  <article class="gm-page">
    <header class="gm-page-head">
      <h1>{{ .Title }}</h1>
      {{ with .Params.summary }}<p class="gm-lede">{{ . }}</p>{{ end }}
      {{ with .Params.cv_file }}<p><a class="gm-btn gm-btn-primary" href="{{ . | relURL }}">{{ i18n "download_cv" }}</a></p>{{ end }}
    </header>
    <div class="prose gm-prose">{{ .Content }}</div>
  </article>
</div>
